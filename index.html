<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Task Scheduling &amp; Alert System</title>
    <meta name="description" content="ระบบจัดตารางงานและแจ้งเตือนอัจฉริยะ" />
    <meta name="theme-color" content="#0b1636" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart Task" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Capture beforeinstallprompt as early as possible, before the React bundle
      // loads/parses/mounts — otherwise the event can fire and be lost before any
      // listener registered inside a React effect has a chance to attach.
      window.__bipEvent = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__bipEvent = e;
        window.dispatchEvent(new CustomEvent('bip-ready'));
      });
      // Once the browser confirms the app was actually installed, never ask again —
      // belt-and-braces alongside the display-mode check (covers e.g. a device that
      // installed it once but, on this particular launch, isn't reporting standalone).
      window.addEventListener('appinstalled', () => {
        try { localStorage.setItem('st_install_dismissed', '1'); } catch (e) {}
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
